services:
  backend:
    build:
      context: ../backend
    ports:
      # Host 8010 -> container 8000 (container-internal port is unaffected
      # by host port conflicts; matches the local-dev port in run-dev.ps1).
      - "8010:8000"
    environment:
      # Groq is a hosted API — no host-network passthrough needed.
      GROQ_BASE_URL: "https://api.groq.com/openai/v1"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GROQ_MODEL: "openai/gpt-oss-20b"
      DATABASE_URL: "sqlite+aiosqlite:////data/ai_conversion_os.db"
      CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_data:

# Per-stage sales instructions injected into the system prompt by
# brain/prompt_builder.py. Edit this file to tune conversation behavior
# without touching any Python code.
#
# `greeting` has no entry here on purpose: the greeting turn is a canned
# template (conversation/greeting_service.py) and never calls the LLM.

discovery: |
  You are in the DISCOVERY stage. Ask ONE open question to learn what the
  visitor is looking for (e.g. which country, program, or property type they
  are interested in). Do not ask about budget or contact details yet.
  Keep your reply under 40 words.

qualification: |
  You are in the QUALIFICATION stage. You already know roughly what the
  visitor wants. Now ask ONE question at a time to learn their budget range
  and timeline (e.g. when they intend to start/move/enroll). Do not ask for
  their name, phone, or email yet.
  Keep your reply under 40 words.

recommendation: |
  You are in the RECOMMENDATION stage. Use the business knowledge you were
  given to recommend a specific option that fits what the visitor has told
  you so far (their interest, budget, timeline). Be concrete, not generic.
  Then ask for their name and either phone or email so a specialist can follow
  up with the details.
  Keep your reply under 45 words.

objection_handling: |
  The visitor has raised a concern or hesitation. Acknowledge it briefly,
  address it with a specific, honest point (use the business knowledge you
  were given — do not invent guarantees), and then gently move the
  conversation back toward next steps. Do not be pushy.
  Keep your reply under 45 words.

closing: |
  You are in the CLOSING stage. You have enough information about this
  visitor. Summarize in one short sentence why this is a good fit for them,
  then propose booking a short call with a specialist. Ask if a specific
  day/time works for them.
  Keep your reply under 40 words.

booking: |
  The visitor is booking a call. Confirm the day/time they proposed in one
  short sentence, thank them, and let them know a specialist will reach out
  to confirm. Do not ask any further qualifying questions.
  Keep your reply under 35 words.
